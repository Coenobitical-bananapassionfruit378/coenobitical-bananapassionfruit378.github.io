<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gilda fitnes — soluciones ópticas</title>
<meta name="description" content="gilda fitnes · soluciones ópticas · portfolio">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='Arial' font-weight='bold' font-style='italic' fill='%230018ff'>g</text></svg>">
<style>
  :root{
    --azul:#0018ff;
    --u: min(1vw, 0.8vh);      /* unidad ligada a un lienzo 1080x1350 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#fff;
    color:var(--azul);
    font-family:Arial, Helvetica, sans-serif;
    font-weight:700;
    font-style:italic;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  a{color:inherit;text-decoration:none}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:3px solid var(--azul);outline-offset:4px}

  /* lienzo 4:5 centrado: mismo encuadre en escritorio y móvil */
  .stage{
    position:relative;
    width:min(100vw, 80vh);
    height:min(125vw, 100vh);
    width:min(100vw, 80dvh);
    height:min(125vw, 100dvh);
    flex:0 0 auto;
    overflow:hidden;
  }

  .lbl{position:absolute;white-space:nowrap;line-height:1}

  .opticas{left:5%;  top:32%;  font-size:calc(6.4 * var(--u))}
  .portfolio{left:5%;top:53.5%;font-size:calc(6.4 * var(--u))}
  .mail{left:10%;    top:75%;  font-size:calc(6.4 * var(--u))}
  .ig{right:9%;      top:86%;  font-size:calc(6.4 * var(--u))}

  .gafas{position:absolute;right:5.5%;top:25.5%;width:32%;height:auto;display:block}

  /* el rebote */
  .bouncer{
    position:absolute;
    top:0;left:0;
    white-space:nowrap;
    font-size:calc(6.4 * var(--u));
    line-height:1;
    will-change:transform;
  }

  @media (prefers-reduced-motion: reduce){
    .bouncer{transition:none}
  }
</style>
</head>
<body>

<main class="stage" id="stage">

  <div class="bouncer" id="bouncer" aria-label="gilda fitnes">gilda fitnes</div>

  <span class="lbl opticas">soluciones ópticas</span>

  <svg class="gafas" viewBox="0 0 340 210" fill="none" aria-hidden="true">
    <g stroke="#0018ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 200c30 0 54-24 54-54s-24-54-54-54-54 24-54 54 24 54 54 54z"/>
      <path d="M204 198c29 0 52-23 52-52s-23-52-52-52-52 23-52 52 23 52 52 52z"/>
      <path d="M31 130C64 71 138 30 232 22c34-3 55 8 57 27 2 16-11 26-26 24"/>
      <path d="M136 128c22-10 44-13 66-8"/>
      <path d="M252 141c30-4 54 4 58 22 4 17-9 31-25 29-13-2-18-14-11-22"/>
    </g>
  </svg>

  <a class="lbl portfolio" href="portfolio.html">portfolio</a>
  <a class="lbl mail" href="mailto:312rimini@gmail.com">312rimini@gmail.com</a>
  <a class="lbl ig" href="https://www.instagram.com/gildafitnes/" target="_blank" rel="noopener">ig</a>

</main>

<script>
(function(){
  var stage = document.getElementById('stage');
  var el = document.getElementById('bouncer');

  var x = 0, y = 0, vx = 1, vy = 1, speed = 34; // px/s a 1080 de ancho
  var W = 0, H = 0, w = 0, h = 0, scale = 1;

  function measure(){
    var r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    var b = el.getBoundingClientRect();
    w = b.width; h = b.height;
    scale = W / 1080;
    x = Math.min(x, Math.max(0, W - w));
    y = Math.min(y, Math.max(0, H - h));
  }

  measure();
  // posición inicial parecida al boceto (arriba a la derecha)
  x = Math.max(0, W * 0.52 - w * 0.2);
  y = H * 0.09;

  var last = null;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(t){
    if(last === null) last = t;
    var dt = Math.min((t - last) / 1000, 0.05);
    last = t;

    if(!reduce){
      var s = speed * scale;
      x += vx * s * dt;
      y += vy * s * dt;

      if(x <= 0){ x = 0; vx = Math.abs(vx); }
      if(x + w >= W){ x = W - w; vx = -Math.abs(vx); }
      if(y <= 0){ y = 0; vy = Math.abs(vy); }
      if(y + h >= H){ y = H - h; vy = -Math.abs(vy); }
    }

    el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('resize', measure);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
</body>
</html>
